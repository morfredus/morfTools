# Configuration du watchdog reseau morfNet (service systemd : morfnetwatchdog).
# Doctrine FS morfSystem : ceci est la config admin (deposee dans /etc, non
# ecrasee par une reinstallation). Toutes les valeurs sont optionnelles :
# "auto" ou vide = detection automatique, adapte a n'importe quel hote.

# Interface reseau surveillee. "auto" = interface de la route par defaut
# (souvent wlan0 sur Raspberry Pi, wlp2s0 sur un PC).
WATCHDOG_IFACE="auto"

# Passerelle testee par ping. "auto" = passerelle de la route par defaut,
# relue a chaque cycle (robuste au DHCP qui change l'adresse).
WATCHDOG_GATEWAY="auto"

# Profil NetworkManager a remonter au palier 1 (facultatif).
# Vide = "nmcli device reconnect <iface>" ; rempli = "nmcli connection up <profil>".
WATCHDOG_CONN=""

# Modules du pilote Wi-Fi a recharger au palier 3. "auto" = detection via le
# pilote de l'interface. Exemple force (Pi recent) : "brcmfmac_cyw brcmfmac".
WATCHDOG_WIFI_MODULES="auto"

# Paliers d'escalade, exprimes en nombre d'echecs consecutifs (timer = 60 s).
# Mettre 0 desactive completement le palier : chaque hote choisit jusqu'ou aller.
# Exemple d'un hote critique sans reboot auto : WATCHDOG_STEP_REBOOT=0
WATCHDOG_STEP_RECONNECT=3       # ~3 min : reconnexion de l'interface / du profil
WATCHDOG_STEP_NM_RESTART=5      # ~5 min : redemarrage de NetworkManager
WATCHDOG_STEP_MODULE_RELOAD=8   # ~8 min : rechargement du pilote Wi-Fi
WATCHDOG_STEP_REBOOT=12         # ~12 min : reboot (dernier recours)

# Garde anti-boucle : delai minimal (secondes) entre deux reboots forces.
WATCHDOG_REBOOT_GUARD_S=1800

# Nombre de pings par cycle avant de declarer le lien perdu.
WATCHDOG_PING_TRIES=3
